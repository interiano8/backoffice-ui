name: Deploy Backoffice UI to Production VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 600s
          command_timeout: 600s
          script: |
            echo "🚀 Iniciando despliegue de backoffice-ui desde GitHub Actions..."
            /opt/webhook/redeploy.sh backoffice-ui main
            echo "✅ Despliegue de backoffice-ui finalizado con éxito."
